{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فراموشی رمز | میوکا</title>

    <link href="{% static 'assets/images/logo/favicon1.png' %}"
          rel="icon">

    <link href="{% static 'assets/vendor/fontawesome/css/all.css' %}"
          rel="stylesheet">

    <link href="{% static 'assets/vendor/bootstrap/bootstrap.min.css' %}"
          rel="stylesheet">

    <link href="{% static 'assets/css/style.css' %}"
          rel="stylesheet">

    <link href="{% static 'assets/css/responsive.css' %}"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'assets/fonts/vazir/Farsi-Digits/Vazirmatn-FD-font-face.css' %}">

    <link rel="stylesheet"
          href="{% static 'assets/css/rtl.css' %}">

</head>


<body class="rtl">

<div class="app-wrapper d-block">

    <main class="w-100 p-0">

        <div class="container-fluid">

            <div class="row">

                <div class="col-12 p-0">

                    <div class="login-form-container">

                        <div class="mb-4">

                            <a class="logo"
                               href="{% url 'accounts:login' %}">

                                <img
                                        alt="میوکا"
                                        src="{% static 'assets/images/logo/3.png' %}"
                                        width="100%"
                                >

                            </a>

                        </div>


                        <div class="form_container">

                            <form
                                    class="app-form"
                                    method="post"
                            >

                                {% csrf_token %}

                                <div class="mb-4 text-center">

                                    <h3>
                                        فراموشی رمز عبور
                                    </h3>

                                    <p class="f-s-12 text-secondary">
                                        شماره تلفن خود را وارد کنید
                                    </p>

                                </div>


                                {% if error %}

                                    <div class="alert alert-danger">

                                        {{ error }}

                                    </div>

                                {% endif %}


                                <div class="mb-3">

                                    <label class="form-label">
                                        شماره تلفن
                                    </label>

                                    <input
                                            class="form-control"
                                            type="text"
                                            name="phone_number"
                                            placeholder="09100119191"
                                            inputmode="numeric"
                                            maxlength="11"
                                            required
                                    >

                                </div>


                                <div>

                                    <button
                                            class="btn btn-primary w-100"
                                            type="submit"
                                    >
                                        دریافت کد
                                    </button>

                                </div>


                                <div class="text-center mt-3">

                                    <a
                                            class="text-secondary text-decoration-underline"
                                            href="{% url 'accounts:login' %}"
                                    >
                                        بازگشت به ورود
                                    </a>
                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<script src="{% static 'assets/js/jquery-3.6.3.min.js' %}"></script>

<script src="{% static 'assets/vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>

</body>

</html>
